name: AI Stock News Scraper (Continuous Loop)

on:
  schedule:
    # 1. 每天晚上 23:00 HKT 啟動 (UTC 15:00) -> 運行至 02:00
    - cron: '0 15 * * *'
    # 2. 週一至五早上 06:00 HKT 啟動 (UTC 前一日 22:00) -> 運行至 10:00
    - cron: '0 22 * * 0-4'
    # 3. 週一至五盤中 10:30 HKT 啟動 (UTC 02:30) -> 運行至 14:00
    - cron: '30 2 * * 1-5'
  workflow_dispatch: # 支援手動觸發（手動觸發時預設運行 1 小時做測試）

permissions:
  contents: write

jobs:
  run_scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 300 # 最長允許運行 5 小時

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "scrapling[all]" curl_cffi playwright patchright browserforge requests google-generativeai pytz

      - name: Run Scraper Loop
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          BULLISH_KEYWORDS: ${{ vars.BULLISH_KEYWORDS }}
        run: python main.py
