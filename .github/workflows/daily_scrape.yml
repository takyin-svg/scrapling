name: Stock News Scraper

on:
  schedule:
    - cron: '0 0 * * 1-5'
  workflow_dispatch: 

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: 下載倉庫代碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝 Scrapling 及所有防爬依賴
        run: |
          python -m pip install --upgrade pip
          # 終極防彈安裝法，徹底解決 ModuleNotFoundError
          pip install "scrapling[all]" curl_cffi playwright patchright browserforge

      - name: 執行股票新聞爬蟲
        run: python main.py
